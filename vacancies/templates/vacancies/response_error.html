<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка отклика</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 100px auto; text-align: center; }
        .error { color: #dc3545; background: #f8d7da; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 30px; background: #e673ec; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="error"> {{ error|default:"Произошла ошибка при отправке отклика" }}</div>
    <a href="javascript:history.back()" class="btn">Вернуться назад</a>
</body>
</html>
