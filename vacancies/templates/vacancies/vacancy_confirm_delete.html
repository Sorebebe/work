<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление вакансии</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
        .warning { background: #fff3cd; border: 1px solid #ffe69c; color: #856404; padding: 15px; border-radius: 4px; margin: 20px 0; }
        button { background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        .cancel { background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Удаление вакансии</h1>
    
    <div class="warning">
        <p>Вы уверены, что хотите удалить вакансию <strong>«{{ vacancy.title }}»</strong>?</p>
        <p><strong>Это действие нельзя отменить!</strong></p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'vacancy_detail' vacancy.id %}" class="cancel">Отмена</a>
    </form>
</body>
</html>
